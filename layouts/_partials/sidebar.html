{{/* Elenco piatto di tutte le pagine, lo stesso della home: niente cartelle. */}}
<aside class="sidebar" id="sidebar">
  <nav aria-label="Navigazione del sito">
    <ul>
      <li>
        <a class="tree-file{{ if .IsHome }} is-active{{ end }}" href="{{ "/" | relURL }}">home</a>
      </li>
      {{ range site.RegularPages.ByDate.Reverse }}
        <li>
          <a
            class="tree-file{{ if eq $.RelPermalink .RelPermalink }} is-active{{ end }}"
            href="{{ .RelPermalink }}"
            >{{ .LinkTitle }}</a
          >
        </li>
      {{ end }}
    </ul>
  </nav>
</aside>

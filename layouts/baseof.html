<!DOCTYPE html>
<html lang="it">
  {{ partial "head.html" . }}
  <body>
    {{ partial "header.html" . }}
    <main>
      {{ partial "sidebar.html" . }}
      <article class="main{{ if .IsHome }} is-home{{ end }}">
        {{ block "main" . }}{{ end }}
      </article>
    </main>
    {{ partial "footer.html" . }}
    <div class="scrim" hidden></div>
    {{ with resources.Get "js/ui.js" | minify | fingerprint }}
      <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
    {{ end }}
  </body>
</html>
